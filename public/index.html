<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsere Pinnwand</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4e4c1;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #5a3e2b;
    }

    form {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input {
      padding: 10px;
      border: 1px solid #c4a878;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      padding: 10px 20px;
      background-color: #5a3e2b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #7a5a42;
    }

    button:disabled {
      background-color: #b0a396;
      cursor: wait;
    }

    /* Statuszeile für Fehler und Hinweise */
    #status {
      min-height: 24px;
      margin-bottom: 25px;
      text-align: center;
      font-size: 14px;
      color: #a33;
    }

    .pinnwand {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .zettel {
      position: relative;
      width: 200px;
      padding: 15px;
      border-radius: 4px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
      transform: rotate(-2deg);
      word-wrap: break-word;
    }

    .gelb  { background-color: #f0e118; }
    .gruen { background-color: #13ff13; }
    .blau  { background-color: #a8d8ff; }
    .lila  { background-color: #e0b8ff; }

    .zettel p {
      margin: 0 0 12px 0;
      font-size: 16px;
    }

    .zettel small {
      color: #777;
      font-style: italic;
    }

    .zeit {
      display: block;
      margin-top: 4px;
      color: #999;
      font-size: 11px;
      font-style: normal;
    }

    .loeschen {
      position: absolute;
      top: 4px;
      right: 6px;
      padding: 0;
      width: 22px;
      height: 22px;
      background: none;
      color: #999;
      font-size: 18px;
      line-height: 1;
    }

    .loeschen:hover {
      background: none;
      color: #c00;
    }

    .leer {
      color: #8a7660;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>Unsere Pinnwand</h1>

  <form id="zettelForm">
    <input type="text" id="nameFeld" placeholder="Dein Name" maxlength="300">
    <input type="text" id="nachrichtFeld" placeholder="Deine Nachricht" maxlength="1000">
    <button type="submit" id="sendenButton">Anpinnen</button>
    <button type="button" id="loeschenAlle">Alle löschen</button>
  </form>

  <div id="status"></div>

  <div class="pinnwand" id="pinnwand"></div>


  <script>
    // ===== 1. Elemente holen =====
    const form = document.querySelector('#zettelForm');
    const nameFeld = document.querySelector('#nameFeld');
    const nachrichtFeld = document.querySelector('#nachrichtFeld');
    const pinnwand = document.querySelector('#pinnwand');
    const statusZeile = document.querySelector('#status');
    const sendenButton = document.querySelector('#sendenButton');
    const loeschenAlleButton = document.querySelector('#loeschenAlle');

    // Kein localStorage mehr - die Daten leben jetzt auf dem Server.
    // Diese Liste ist nur noch eine Kopie zum Anzeigen.
    let zettelListe = [];


    function statusSetzen(text) {
      statusZeile.textContent = text;
    }


    // ===== 2. Zettel vom Server holen =====
    // "async" heisst: in dieser Funktion darf gewartet werden.
    async function zettelHolen() {
      try {
        // "await" wartet, bis der Server geantwortet hat
        const antwort = await fetch('/api/zettel');

        if (!antwort.ok) {
          throw new Error('Server antwortet mit Status ' + antwort.status);
        }

        zettelListe = await antwort.json();   // JSON in echte Daten umwandeln
        statusSetzen('');
        anzeigen();

      } catch (fehler) {
        // Landet hier, wenn der Server aus ist oder einen Fehler meldet
        statusSetzen('Keine Verbindung zum Server. Läuft er noch?');
        console.error(fehler);
      }
    }


    // ===== 3. Neuen Zettel zum Server schicken =====
    async function zettelSenden(name, nachricht) {
      sendenButton.disabled = true;           // Doppelklicks verhindern

      try {
        const antwort = await fetch('/api/zettel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, nachricht: nachricht })
        });

        const daten = await antwort.json();

        if (!antwort.ok) {
          // Der Server hat abgelehnt und sagt auch warum
          statusSetzen(daten.fehler || 'Der Zettel wurde abgelehnt.');
          return;
        }

        nachrichtFeld.value = '';
        nachrichtFeld.focus();
        await zettelHolen();                  // frische Liste holen

      } catch (fehler) {
        statusSetzen('Konnte nicht senden. Server erreichbar?');
        console.error(fehler);

      } finally {
        sendenButton.disabled = false;        // läuft immer, egal was passiert
      }
    }


    // ===== 4. Löschen =====
    async function zettelLoeschen(id) {
      try {
        await fetch('/api/zettel/' + id, { method: 'DELETE' });
        await zettelHolen();
      } catch (fehler) {
        statusSetzen('Löschen fehlgeschlagen.');
      }
    }

    async function alleLoeschen() {
      try {
        await fetch('/api/zettel', { method: 'DELETE' });
        await zettelHolen();
      } catch (fehler) {
        statusSetzen('Löschen fehlgeschlagen.');
      }
    }


    // ===== 5. Anzeigen (fast unverändert) =====
    function anzeigen() {
      pinnwand.innerHTML = '';

      if (zettelListe.length === 0) {
        const hinweis = document.createElement('p');
        hinweis.className = 'leer';
        hinweis.textContent = 'Noch keine Zettel. Schreib den ersten!';
        pinnwand.appendChild(hinweis);
        return;
      }

      zettelListe.forEach(function (eintrag) {
        const zettel = document.createElement('div');
        zettel.className = 'zettel ' + eintrag.farbe;

        const text = document.createElement('p');
        text.textContent = eintrag.nachricht;

        const autor = document.createElement('small');
        autor.textContent = 'von ' + eintrag.name;

        const zeit = document.createElement('span');
        zeit.className = 'zeit';
        zeit.textContent = new Date(eintrag.zeit).toLocaleString('de-DE');
        autor.appendChild(zeit);

        const loeschen = document.createElement('button');
        loeschen.className = 'loeschen';
        loeschen.textContent = '×';
        // Jetzt über die ID vom Server, nicht mehr über die Position
        loeschen.addEventListener('click', function () {
          zettelLoeschen(eintrag.id);
        });

        zettel.appendChild(loeschen);
        zettel.appendChild(text);
        zettel.appendChild(autor);
        pinnwand.appendChild(zettel);
      });
    }


    // ===== 6. Formular =====
    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = nameFeld.value.trim();
      const nachricht = nachrichtFeld.value.trim();

      if (name === '' || nachricht === '') {
        statusSetzen('Bitte Name und Nachricht ausfüllen.');
        return;
      }

      statusSetzen('');
      zettelSenden(name, nachricht);
    });

    loeschenAlleButton.addEventListener('click', function () {
      if (confirm('Willst du wirklich alle Zettel löschen?')) {
        alleLoeschen();
      }
    });


    // ===== 7. Start: laden und alle 5 Sekunden aktualisieren =====
    zettelHolen();

    // Damit Zettel von Freunden von selbst auftauchen
    setInterval(zettelHolen, 5000);
  </script>

</body>
</html>
