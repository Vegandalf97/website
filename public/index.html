<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Wall of Notes</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- Bleibt beim Scrollen oben stehen -->
  <header class="kopfleiste">

    <!-- Statusmeldungen oben links -->
    <div id="status"></div>

    <!-- Anmeldebereich oben rechts -->
    <div class="konto" id="konto"></div>

    <nav class="navi">
      <a href="/index.html" class="aktiv">Wall of notes</a>
      <a href="/galerie.html">Projects</a>
      <a href="/ueber.html">About me</a>
    </nav>

  </header>

<div class="kopfreihe">
    <h1>Wall of notes</h1>
    <div class="waendeLeiste" id="waendeLeiste"></div>

    <!-- Hilfe ganz rechts, auf Höhe der Überschrift -->
    <div class="hilfeEcke">
      <button type="button" class="hilfeKnopf" id="hilfeKnopf"
              title="Hilfe" aria-expanded="false">Help</button>

      <div class="hilfeFenster" id="hilfeFenster" hidden>
        <p>Dubbleclick on the wall, to create a note.</p>

        <p class="hilfeTitel">Useful commands</p>

        <ul class="hilfeListe">
          <li><code>/paint</code></li>
          <li><code>/merz</code></li>
          <li><code>/kim</code></li>
          <li><code>/trump</code></li>
          <li><code>/china</code></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="wandRahmen" id="wandRahmen">
    <div class="wand" id="wand"></div>

    <div class="zoomLeiste">
      <button type="button" id="zoomRaus" title="Verkleinern">&minus;</button>
      <button type="button" id="zoomRein" title="Vergrößern">+</button>
      <button type="button" id="zoomAlles" title="Alles zeigen">&#9974;</button>
    </div>
  </div>

  <script src="/konto.js"></script>
  <script src="/malen.js"></script>
  <script src="/pinnwand.js"></script>

</body>
</html>
